name: "Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install

      - name: check version consistency
        run: npm run check:version

      - name: run frontend tests
        run: npm run test -- --run

      - name: run backend tests
        # The Windows release runner has repeatedly crashed with
        # STATUS_ACCESS_VIOLATION while launching the lib-test binary, even
        # with one test thread. Linux CI runs the full suite; Windows still
        # compiles every test target before packaging.
        if: matrix.platform != 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: check Windows backend test targets compile
        if: matrix.platform == 'windows-latest'
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - uses: tauri-apps/tauri-action@v0
        id: tauri_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # tauri-action replaces this with the app version
          releaseName: "MobaXTauri v__VERSION__"
          releaseBody: "See the assets below to download MobaXTauri for your platform."
          releaseDraft: true
          prerelease: false

      - name: Prepare Portable Executable (Windows Only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item "src-tauri/target/release/mobaxtauri.exe" `
                    "src-tauri/target/release/MobaXTauri_Portable.exe"

      - name: Upload Portable Executable to Release (Windows Only)
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v3
        with:
          files: src-tauri/target/release/MobaXTauri_Portable.exe
          tag_name: v${{ steps.tauri_build.outputs.appVersion }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
