name: Bug report
description: Report a reproducible problem in MobaXTauri
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove credentials, private keys, hostnames, IP addresses, and other sensitive data from all submissions.
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no secrets or identifying infrastructure data.
          required: true
        - label: This is not a security vulnerability (security reports must follow SECURITY.md).
          required: true
  - type: input
    attributes:
      label: MobaXTauri version
      placeholder: Version number or commit SHA
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Explain the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Sanitized logs or screenshots
      description: Optional. Double-check that all secrets and infrastructure details are removed.
  - type: textarea
    attributes:
      label: Additional context
